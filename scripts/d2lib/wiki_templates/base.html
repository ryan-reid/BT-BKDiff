<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ title }}</title>
  <link rel="stylesheet" href="{{ site_root }}assets/site.css" />
</head>
<body data-site-root="{{ site_root }}">
  <div class="site-shell">
    <header class="site-header">
      <div class="brand-bar">
        <a class="brand-mark" href="{{ site_root }}">BT Diablo Data Wiki</a>
        <p class="brand-copy">Generated static site from current project exports</p>
      </div>
      <nav class="site-nav">
        <a href="{{ site_root }}">Home</a>
        <a href="{{ site_root }}items/">All Items</a>
        <a href="{{ site_root }}bases/">Bases</a>
        <a href="{{ site_root }}recipes/">Recipes</a>
        <a href="{{ site_root }}bestiary/">Bestiary</a>
        <a href="{{ site_root }}misc/">Materials</a>
        <a href="{{ site_root }}mechanics/">Mechanics</a>
        <a href="{{ site_root }}areas/">Areas</a>
        <a href="{{ site_root }}classes/">Classes</a>
        <a href="{{ site_root }}reports/">Reports</a>
        <a href="{{ site_root }}patch-notes/full-patch-notes-draft/">Patch Notes</a>
      </nav>
    </header>
    <main class="site-main">
      {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
      <p>Generated by <code>scripts/generate_reports.py</code> from current BK exports and skill tree outputs.</p>
    </footer>
  </div>
  <script src="{{ site_root }}assets/site.js"></script>
</body>
</html>

name: Wiki Pages

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/wiki-pages.yml"
      - ".gitmodules"
      - "data/**"
      - "mods/**"
      - "requirements.txt"
      - "scripts/**"
      - "tests/**"
  schedule:
    # Twice-daily fallback; the homelab checks every 15 minutes.
    - cron: "7 9,21 * * *"
  workflow_dispatch:
    inputs:
      check_only:
        description: Compatibility input for the homelab monitor (all runs now build)
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Update submodules to configured branches
        run: git submodule update --init --recursive --remote

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run test suite
        run: python -m unittest discover -s tests

      - name: Generate reports and wiki
        run: python scripts/generate_reports.py

      - name: Include source revisions in the deployed site
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          def revision(path):
              return subprocess.check_output(["git", "-C", path, "rev-parse", "HEAD"], text=True).strip()

          revisions = {
              "repository": revision("."),
              "BKDiablo": revision("mods/BKDiablo"),
              "BTDiablo": revision("mods/BTDiablo"),
          }
          Path("output/wiki/source-revisions.json").write_text(json.dumps(revisions) + "\n", encoding="utf-8")
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output/wiki

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

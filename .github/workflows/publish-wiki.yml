name: Publish Wiki

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-wiki.yml"
      - ".gitmodules"
      - "data/**"
      - "mods/**"
      - "requirements.txt"
      - "scripts/**"
      - "tests/**"
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      rebuild: ${{ steps.sources.outputs.rebuild }}
      revisions: ${{ steps.sources.outputs.revisions }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check upstream commits against the live site
        id: sources
        uses: actions/github-script@v7
        with:
          script: |
            const check = require('./scripts/check_wiki_updates.cjs');
            await check({github, context, core, exec});

  build:
    needs: check
    if: needs.check.outputs.rebuild == 'true'
    runs-on: ubuntu-latest
    env:
      SOURCE_REVISIONS: ${{ needs.check.outputs.revisions }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Pin submodules to the checked upstream commits
        run: |
          for mod in BKDiablo BTDiablo; do
            revision=$(jq -er --arg mod "$mod" '.[$mod]' <<< "$SOURCE_REVISIONS")
            git -C "mods/$mod" fetch origin "$revision"
            git -C "mods/$mod" checkout --detach "$revision"
          done
          git submodule foreach 'git submodule update --init --recursive'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run test suite
        run: python -m unittest discover -s tests

      - name: Generate reports and wiki
        run: python scripts/generate_reports.py

      - name: Include source revisions in the deployed site
        run: printf '%s\n' "$SOURCE_REVISIONS" > output/wiki/source-revisions.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output/wiki

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
